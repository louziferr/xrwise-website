<svg viewBox="0 0 400 440" xmlns="http://www.w3.org/2000/svg"
    style="width:100%;height:100%;position:absolute;inset:0;">
    <defs>
        <pattern id="pgrid" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#D0CEC8" stroke-width="0.4" />
        </pattern>
        <marker id="parr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#FF1F8E" fill-opacity="0.7" />
        </marker>
    </defs>

    <rect width="400" height="440" fill="#F2F0EB" />
    <rect width="400" height="440" fill="url(#pgrid)" />

    <!-- ══ 1. ADMIN HEADER ══ -->
    <rect x="28" y="28" width="344" height="44" rx="8" fill="#4D4D4B" />
    <text x="200" y="46" font-family="Saira, sans-serif" font-size="9" font-weight="600"
        fill="#FFFFFF"
        text-anchor="middle" letter-spacing="0.14em">XRWISE ADMINISTRATION UND SUPPORT</text>
    <text x="200" y="59" font-family="Saira, sans-serif" font-size="7" fill="rgba(255,255,255,0.45)"
        text-anchor="middle" letter-spacing="0.08em">Zentrale Projektverwaltung</text>

    <!-- ══ 2. TWO FEATURE CARDS (from image) ══ -->
    <!-- Card A: Archivieren & Weitergenutzung -->
    <rect x="28" y="90" width="168" height="90" rx="8" fill="#FFFFFF" stroke="#D8D6CE"
        stroke-width="1.5" />
    <rect x="28" y="90" width="168" height="4" rx="2" fill="#FF1F8E" fill-opacity="0.6" />
    <!-- icon: archive box -->
    <rect x="42" y="104" width="18" height="14" rx="2" fill="none" stroke="#FF1F8E"
        stroke-width="1.5" />
    <line x1="42" y1="109" x2="60" y2="109" stroke="#FF1F8E" stroke-width="1" />
    <rect x="46" y="101" width="10" height="5" rx="1" fill="none" stroke="#FF1F8E"
        stroke-width="1.2" />
    <text x="68" y="112" font-family="Saira, sans-serif" font-size="7.5" font-weight="700"
        fill="#4D4D4B">Archivieren &amp;</text>
    <text x="68" y="122" font-family="Saira, sans-serif" font-size="7.5" font-weight="700"
        fill="#4D4D4B">Wiederverwenden</text>
    <!-- body text -->
    <text x="42" y="142" font-family="Saira, sans-serif" font-size="7" fill="#888780">Erlaubt das
        Archivieren
        über</text>
    <text x="42" y="153" font-family="Saira, sans-serif" font-size="7" fill="#888780">längeren
        Zeitraum und
        die</text>
    <text x="42" y="164" font-family="Saira, sans-serif" font-size="7" fill="#888780">
        Weitergenutzung</text>

    <!-- Card B: Nicht bei 0 anfangen -->
    <rect x="208" y="90" width="164" height="90" rx="8" fill="#FFFFFF" stroke="#D8D6CE"
        stroke-width="1.5" />
    <rect x="208" y="90" width="164" height="4" rx="2" fill="#FF1F8E" fill-opacity="0.6" />
    <!-- icon: layers/copy -->
    <rect x="222" y="103" width="16" height="13" rx="2" fill="none" stroke="#FF1F8E"
        stroke-width="1.5" />
    <rect x="226" y="99" width="16" height="13" rx="2" fill="none" stroke="#FF1F8E"
        stroke-width="1.2"
        stroke-opacity="0.5" />
    <text x="246" y="112" font-family="Saira, sans-serif" font-size="7.5" font-weight="700"
        fill="#4D4D4B">Nicht
        bei 0</text>
    <text x="246" y="122" font-family="Saira, sans-serif" font-size="7.5" font-weight="700"
        fill="#4D4D4B">anfangen</text>
    <text x="222" y="142" font-family="Saira, sans-serif" font-size="7" fill="#888780">können direkt
        mit
        der</text>
    <text x="222" y="153" font-family="Saira, sans-serif" font-size="7" fill="#888780">Entwicklung
        von
        Inhalten</text>
    <text x="222" y="164" font-family="Saira, sans-serif" font-size="7" fill="#888780">anfangen</text>

    <!-- ══ 3. UPDATES CARD (full width) ══ -->
    <rect x="28" y="196" width="344" height="44" rx="8" fill="#FFFFFF" stroke="#D8D6CE"
        stroke-width="1.5" />
    <rect x="28" y="196" width="344" height="4" rx="2" fill="#FF1F8E" fill-opacity="0.6" />
    <!-- icon: refresh -->
    <text x="46" y="223" font-family="Saira, sans-serif" font-size="14" fill="#FF1F8E"
        fill-opacity="0.8">↻</text>
    <text x="66" y="217" font-family="Saira, sans-serif" font-size="7.5" font-weight="700"
        fill="#4D4D4B">Immer
        aktuelles Unity</text>
    <text x="66" y="229" font-family="Saira, sans-serif" font-size="7" fill="#888780">Permanente
        Updates von
        Plugins — ohne eigenes Tech-Team</text>
    <!-- live badge -->
    <rect x="308" y="208" width="52" height="14" rx="5" fill="#FF1F8E" fill-opacity="0.1" />
    <circle cx="319" cy="215" r="3" fill="#FF1F8E">
        <animate attributeName="fill-opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="325" y="219" font-family="Saira, sans-serif" font-size="6.5" font-weight="600"
        fill="#FF1F8E">live</text>

    <!-- ══ DIVIDER ══ -->
    <line x1="28" y1="258" x2="372" y2="258" stroke="#D8D6CE" stroke-width="0.8"
        stroke-dasharray="6 4" />

    <!-- ══ 4. OUTCOME CARDS ══ -->
    <!-- Card 1: Lernerfolg -->
    <rect x="28" y="274" width="100" height="92" rx="10" fill="#FFFFFF" stroke="#D8D6CE"
        stroke-width="1.5" />
    <rect x="28" y="274" width="100" height="4" rx="2" fill="#FF1F8E" fill-opacity="0.8" />
    <text x="78" y="298" font-family="Saira, sans-serif" font-size="7" font-weight="600"
        fill="#888780"
        text-anchor="middle" letter-spacing="0.1em">LERNERFOLG</text>
    <text x="78" y="332" font-family="Saira, sans-serif" font-size="28" font-weight="700"
        fill="#FF1F8E"
        text-anchor="middle">↑75%</text>
    <text x="78" y="354" font-family="Saira, sans-serif" font-size="6.5" fill="#B0AEA8"
        text-anchor="middle">vs.
        Lehrvideos</text>

    <!-- Card 2: Kosten -->
    <rect x="150" y="274" width="100" height="92" rx="10" fill="#FFFFFF" stroke="#D8D6CE"
        stroke-width="1.5" />
    <rect x="150" y="274" width="100" height="4" rx="2" fill="#FF1F8E" fill-opacity="0.8" />
    <text x="200" y="298" font-family="Saira, sans-serif" font-size="7" font-weight="600"
        fill="#888780"
        text-anchor="middle" letter-spacing="0.1em">KOSTEN</text>
    <text x="200" y="332" font-family="Saira, sans-serif" font-size="28" font-weight="700"
        fill="#FF1F8E"
        text-anchor="middle">↓60%</text>
    <text x="200" y="354" font-family="Saira, sans-serif" font-size="6.5" fill="#B0AEA8"
        text-anchor="middle">vs.
        Präsenzformat</text>

    <!-- Card 3: Wiederholungen -->
    <rect x="272" y="274" width="100" height="92" rx="10" fill="#FFFFFF" stroke="#D8D6CE"
        stroke-width="1.5" />
    <rect x="272" y="274" width="100" height="4" rx="2" fill="#FF1F8E" fill-opacity="0.8" />
    <text x="322" y="298" font-family="Saira, sans-serif" font-size="7" font-weight="600"
        fill="#888780"
        text-anchor="middle" letter-spacing="0.1em">WIEDERHOLUNGEN</text>
    <text x="322" y="332" font-family="Saira, sans-serif" font-size="28" font-weight="700"
        fill="#FF1F8E"
        text-anchor="middle">∞</text>
    <text x="322" y="354" font-family="Saira, sans-serif" font-size="6.5" fill="#B0AEA8"
        text-anchor="middle">ohne
        Mehrkosten</text>

    <!-- bottom note -->
    <text x="200" y="390" font-family="Saira, sans-serif" font-size="7" fill="#C8C6BE"
        text-anchor="middle"
        letter-spacing="0.06em">Einmal erstellt — unbegrenzt eingesetzt</text>

    <!-- decorative dots -->
    <circle cx="168" cy="408" r="3" fill="#FF1F8E" fill-opacity="0.2" />
    <circle cx="181" cy="408" r="3" fill="#FF1F8E" fill-opacity="0.15" />
    <circle cx="194" cy="408" r="3" fill="#FF1F8E" fill-opacity="0.1" />
    <circle cx="207" cy="408" r="3" fill="#FF1F8E" fill-opacity="0.15" />
    <circle cx="220" cy="408" r="3" fill="#FF1F8E" fill-opacity="0.2" />
</svg>